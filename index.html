<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماي فون | إدارة المتجر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#714B67;      /* لون أودو البنفسجي */
  --secondary:#017E84;
  --bg:#F1F1F1;
  --card:#FFFFFF;
  --text:#374151;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--text)}

/* ===== الشريط العلوي ===== */
.navbar{
  background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 24px;box-shadow:0 2px 6px rgba(0,0,0,.2);
  position:sticky;top:0;z-index:100;
}
.navbar .logo{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
.navbar .logo span{background:#fff;color:var(--primary);border-radius:8px;padding:2px 10px}

/* ===== قائمة التطبيقات (بأسلوب أودو) ===== */
.apps-grid{display:flex;gap:20px;padding:30px;flex-wrap:wrap;justify-content:center}
.app-card{
  background:var(--card);border-radius:12px;width:160px;height:160px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;cursor:pointer;text-decoration:none;color:var(--text);
  box-shadow:0 2px 8px rgba(0,0,0,.08);transition:.25s;
}
.app-card:hover{transform:translateY(-5px);box-shadow:0 8px 20px rgba(113,75,103,.3)}
.app-icon{
  width:64px;height:64px;border-radius:14px;background:var(--secondary);
  display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;
}
.app-card.disabled{opacity:.4;cursor:not-allowed}

/* ===== شاشة تطبيق الصيانة ===== */
#maintenanceApp{display:none;padding:24px;max-width:1200px;margin:auto}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.btn{
  background:var(--primary);color:#fff;border:none;border-radius:8px;
  padding:10px 22px;font-size:15px;cursor:pointer;font-family:'Cairo';
}
.btn:hover{opacity:.9}
table{width:100%;background:#fff;border-radius:10px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);border-collapse:collapse}
th{background:var(--primary);color:#fff;padding:12px;font-size:14px}
td{padding:11px;border-bottom:1px solid #eee;text-align:center;font-size:14px}
tr:hover td{background:#faf7fb}
.badge{padding:4px 12px;border-radius:20px;font-size:12px;color:#fff}
.b-new{background:#017E84}.b-progress{background:#f59e0b}.b-done{background:#16a34a}

/* نموذج الإضافة */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;
  align-items:center;justify-content:center;z-index:200}
.modal{background:#fff;border-radius:12px;padding:28px;width:420px;max-width:95%}
.modal h3{margin-bottom:18px;color:var(--primary)}
.modal input,.modal select,.modal textarea{
  width:100%;padding:10px;margin-bottom:12px;border:1px solid #ddd;
  border-radius:8px;font-family:'Cairo'}
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">📱 <span>My Phone</span> | لوحة الإدارة</div>
  <button class="btn" onclick="showApps()">🏠 الرئيسية</button>
</nav>

<!-- قائمة التطبيقات -->
<div class="apps-grid" id="appsHome">
  <a class="app-card" onclick="openMaintenance()">
    <div class="app-icon">🔧</div><div>الصيانة</div>
  </a>
  <div class="app-card disabled"><div class="app-icon" style="background:#94a3b8">📦</div><div>المخزون</div></div>
  <div class="app-card disabled"><div class="app-icon" style="background:#94a3b8">🧾</div><div>الفواتير</div></div>
  <div class="app-card disabled"><div class="app-icon" style="background:#94a3b8">👥</div><div>العملاء</div></div>
</div>

<!-- تطبيق الصيانة -->
<div id="maintenanceApp">
  <div class="page-header">
    <h2>🔧 أوامر الصيانة</h2>
    <button class="btn" onclick="openModal()">➕ أمر صيانة جديد</button>
  </div>
  <table>
    <thead><tr>
      <th>#</th><th>اسم العميل</th><th>الجهاز</th><th>العطل</th>
      <th>التكلفة</th><th>الحالة</th><th>التاريخ</th>
    </tr></thead>
    <tbody id="ordersBody"><tr><td colspan="7">⏳ جارٍ التحميل...</td></tr></tbody>
  </table>
</div>

<!-- نافذة الإضافة -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>أمر صيانة جديد</h3>
    <input id="fName" placeholder="اسم العميل">
    <input id="fDevice" placeholder="نوع الجهاز (مثال: iPhone 13)">
    <textarea id="fIssue" placeholder="وصف العطل"></textarea>
    <input id="fCost" type="number" placeholder="التكلفة">
    <select id="fStatus">
      <option value="جديد">جديد</option>
      <option value="قيد التنفيذ">قيد التنفيذ</option>
      <option value="مكتمل">مكتمل</option>
    </select>
    <button class="btn" style="width:100%" onclick="saveOrder()">💾 حفظ في Google Sheets</button>
  </div>
</div>

<script>
const API_URL = "ضع_رابط_Web_App_هنا"; // رابط Google Apps Script

function openMaintenance(){
  document.getElementById('appsHome').style.display='none';
  document.getElementById('maintenanceApp').style.display='block';
  loadOrders();
}
function showApps(){
  document.getElementById('appsHome').style.display='flex';
  document.getElementById('maintenanceApp').style.display='none';
}
function openModal(){document.getElementById('modalBg').style.display='flex'}

async function loadOrders(){
  const res = await fetch(API_URL);
  const data = await res.json();
  const badge = s => s==='مكتمل'?'b-done':s==='قيد التنفيذ'?'b-progress':'b-new';
  document.getElementById('ordersBody').innerHTML = data.map(o=>`
    <tr>
      <td>o.id</td><td>{o.id}</td><td>o.id</td><td>{o.name}</td><td>${o.device}</td>
      <td>o.issue</td><td>{o.issue}</td><td>o.issue</td><td>{o.cost} ج.م</td>
      <td><span class="badge badge(o.status)">{badge(o.status)}">badge(o.status)">{o.status}</span></td>
      <td>${o.date}</td>
    </tr>`).join('');
}

async function saveOrder(){
  const order = {
    name: fName.value, device: fDevice.value,
    issue: fIssue.value, cost: fCost.value, status: fStatus.value
  };
  await fetch(API_URL,{method:'POST',body:JSON.stringify(order)});
  modalBg.style.display='none'; loadOrders();
}
</script>
</body>
</html>
